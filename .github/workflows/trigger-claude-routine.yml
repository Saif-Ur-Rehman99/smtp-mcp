name: Trigger Claude Code Routine

on:
  push:
  pull_request:

jobs:
  fire-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Fire Claude Code routine
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then
            echo "::error::ROUTINE_FIRE_URL or ROUTINE_FIRE_TOKEN secret is missing. Add both in Settings > Secrets and variables > Actions."
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/response.json -w "%{http_code}" -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"GitHub event: $GITHUB_EVENT_NAME on $GITHUB_REF by $GITHUB_ACTOR. Repo: $GITHUB_REPOSITORY. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}")

          echo "HTTP status: $http_code"
          cat /tmp/response.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Routine fire request failed with HTTP $http_code"
            exit 1
          fi
